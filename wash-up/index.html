<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ready for Bed | When Sunday Comes Around</title>
    <link rel="preload" href="/bathroom.webp" as="image" type="image/webp">
    <link rel="preload" href="/bath-sprite.webp" as="image" type="image/webp">
    <link rel="preload" href="/bath-dirt.webp" as="image" type="image/webp">
    <style>
      .bath-starting { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; background: #faf7f0; color: #564736; font: clamp(1.5rem, 3.4vw, 2rem) system-ui, sans-serif; visibility: hidden; animation: bath-starting-show 0s 500ms forwards; }
      .bath-starting progress { width: min(330px, 78vw); height: 19px; accent-color: #547b68; }
      @keyframes bath-starting-show { to { visibility: visible; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bath-starting" role="status">
        Getting the bath ready…
        <progress aria-label="Loading the bath"></progress>
      </div>
    </div>
    <script type="module" src="/src/wash-up.tsx"></script>
  </body>
</html>
